name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:public
      - name: Prepare browser
        shell: bash
        run: |
          if task_chrome_path=$(command -v google-chrome); then
            "$task_chrome_path" --version
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$task_chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
